[project]
name = "riderecord-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.6",
    "google-cloud-bigquery>=3.25",
    "google-cloud-firestore>=2.19",
    "httpx>=0.28.1",
    "ibm-watsonx-ai>=1.9.1",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
