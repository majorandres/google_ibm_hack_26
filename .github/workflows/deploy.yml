# Deploys main to Google Cloud Run: runs CI, pushes the image to Artifact
# Registry, then points the existing Cloud Run service at the new image.
#
# One-time setup (see docs/ci-cd.md):
#   - Repository secret GCP_SA_KEY and repository variable GCP_PROJECT_ID
#   - Run scripts/deploy.sh once, so the registry, Firestore, the BigQuery
#     table, the secret and the service itself exist. This workflow only
#     updates the service's image.
name: Deploy

on:
  push:
    branches: [main]
    # A push that only touches docs does not deploy, so it cannot hold up a
    # code fix queued behind it. A push with any other file still deploys.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  APP_NAME: riderecord

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Cloud Run
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Queue deploys instead of running two at once; never cancel one half-way.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.rollout.outputs.url }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the Google Cloud settings are configured
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ] || [ -z "$PROJECT_ID" ]; then
            echo "::error::Set the GCP_SA_KEY secret and the GCP_PROJECT_ID variable. See docs/ci-cd.md."
            exit 1
          fi

      - name: Pick the image tag
        id: meta
        run: |
          tag="${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"
          echo "image=$REGION-docker.pkg.dev/$PROJECT_ID/$APP_NAME/$APP_NAME:$tag" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Log Docker in to Artifact Registry
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Roll the Cloud Run service to the new image
        id: rollout
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          if ! gcloud run services describe "$APP_NAME" --region "$REGION" > /dev/null 2>&1; then
            echo "::error::Cloud Run service '$APP_NAME' does not exist yet. Run scripts/deploy.sh once to create it."
            exit 1
          fi
          gcloud run deploy "$APP_NAME" --image "$IMAGE" --region "$REGION" --quiet
          url="$(gcloud run services describe "$APP_NAME" --region "$REGION" --format 'value(status.url)')"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $IMAGE to $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test the live app
        env:
          URL: ${{ steps.rollout.outputs.url }}
        run: |
          for _ in $(seq 1 10); do
            curl -fsS "$URL/api/health" && exit 0
            sleep 6
          done
          echo "::error::$URL/api/health did not respond with 200 after the rollout."
          exit 1
