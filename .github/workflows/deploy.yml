# Deploys main to IBM Code Engine: runs CI, pushes the image to IBM Container
# Registry, then points the existing Code Engine app at the new image.
#
# One-time setup (see docs/ci-cd.md):
#   - Repository secret IBMCLOUD_API_KEY
#   - Run scripts/deploy.sh once, so the registry namespace, the Code Engine
#     secrets and the app itself exist. This workflow only updates the app.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGION: us-south
  RESOURCE_GROUP: Default
  REGISTRY: us.icr.io
  CR_NAMESPACE: ${{ vars.CR_NAMESPACE || 'midevfest-commute-check' }}
  CODE_ENGINE_PROJECT: watsonx-Hackathon Code Engine
  APP_NAME: commute-check

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Code Engine
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Queue deploys instead of running two at once; never cancel one half-way.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.rollout.outputs.url }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the IBM Cloud API key is configured
        env:
          IBMCLOUD_API_KEY: ${{ secrets.IBMCLOUD_API_KEY }}
        run: |
          if [ -z "$IBMCLOUD_API_KEY" ]; then
            echo "::error::Repository secret IBMCLOUD_API_KEY is not set. See docs/ci-cd.md."
            exit 1
          fi

      - name: Pick the image tag
        id: meta
        run: |
          tag="${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"
          echo "image=$REGISTRY/$CR_NAMESPACE/$APP_NAME:$tag" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to IBM Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: iamapikey
          password: ${{ secrets.IBMCLOUD_API_KEY }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install IBM Cloud CLI and log in
        uses: IBM/actions-ibmcloud-cli@v2.2.1
        with:
          api_key: ${{ secrets.IBMCLOUD_API_KEY }}
          region: ${{ env.REGION }}
          group: ${{ env.RESOURCE_GROUP }}
          plugins: code-engine

      - name: Roll the Code Engine app to the new image
        id: rollout
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          ibmcloud ce project select --name "$CODE_ENGINE_PROJECT"
          if ! ibmcloud ce app get --name "$APP_NAME" > /dev/null 2>&1; then
            echo "::error::Code Engine app '$APP_NAME' does not exist yet. Run scripts/deploy.sh once to create it."
            exit 1
          fi
          ibmcloud ce app update --name "$APP_NAME" --image "$IMAGE" --wait --wait-timeout 300
          url="$(ibmcloud ce app get --name "$APP_NAME" --output url)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $IMAGE to $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test the live app
        env:
          URL: ${{ steps.rollout.outputs.url }}
        run: |
          for _ in $(seq 1 10); do
            curl -fsS "$URL/api/health" && exit 0
            sleep 6
          done
          echo "::error::$URL/api/health did not respond with 200 after the rollout."
          exit 1
