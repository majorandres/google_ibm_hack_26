# Checks every pull request. deploy.yml also calls this workflow before it deploys main.
name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels that PR's older run. Runs called from deploy.yml
# are never cancelled, so a deploy cannot lose its CI half-way.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          working-directory: backend
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies from uv.lock
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Test
        run: uv run pytest

  frontend:
    name: Frontend (oxlint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies from package-lock.json
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check and build
        run: npm run build

  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - name: Check formatting
        run: terraform fmt -check -recursive -diff
      - name: Init without a backend (no cloud credentials needed)
        run: terraform init -backend=false -input=false
      - name: Validate
        run: terraform validate

  image:
    name: Docker image (build + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: riderecord:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the container and check it serves the API and the frontend
        run: |
          docker run -d --name app -p 8080:8080 riderecord:ci
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8080/api/health && break
            sleep 1
          done
          echo
          curl -fsS http://localhost:8080/api/health | grep -q '"status":"ok"'
          curl -fsS http://localhost:8080/ | grep -qi '<div id="root">'
      - name: Container logs
        if: always()
        run: docker logs app || true
